<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuesday Table</title></head><body><script>(async()=>{let s='';for(let i=1;i<=9;i++)s+=await fetch(`q${i}.txt`).then(r=>r.text());let b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));let t=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()})().catch(e=>document.body.innerHTML='<pre>Failed to load Tuesday Table: '+e+'</pre>')</script></body></html>
